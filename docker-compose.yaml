services:
  postgres:
    image: postgres:16-alpine
    container_name: tcg-postgres
    restart: always
    environment:
      POSTGRES_DB: tcg_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: